<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; gap: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    #counter { font-size: 1.1rem; color: #555; }
    #voteBtn { font-size: 1.1rem; padding: 0.75rem 2.5rem; border-radius: 12px; border: none; background: #4f46e5; color: white; cursor: pointer; transition: background 0.2s; }
    #voteBtn:hover { background: #4338ca; }
    #voteBtn:disabled { background: #aaa; cursor: not-allowed; }
    #popup { position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); background: #22c55e; color: white; padding: 0.75rem 1.5rem; border-radius: 10px; font-size: 1rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #popup.error { background: #ef4444; }
    #popup.show { opacity: 1; }
    #resetArea { margin-top: 2rem; display: flex; gap: 0.5rem; }
    #resetArea input { padding: 0.5rem; border: 1px solid #ccc; border-radius: 8px; }
    #resetBtn { padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #ccc; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Do you like this?</h1>
  <p id="counter">Loading...</p>
  <button id="voteBtn">👍 Vote</button>
  <div id="popup"></div>

  <div id="resetArea">
    <input type="password" id="secretInput" placeholder="Admin password" />
    <button id="resetBtn">Reset counter</button>
  </div>

  <script>
    const WORKER = 'https://bold-queen-e436.noordin50000.workers.dev';
    const btn = document.getElementById('voteBtn');
    const counter = document.getElementById('counter');
    const popup = document.getElementById('popup');

    function showPopup(msg, isError = false) {
      popup.textContent = msg;
      popup.className = 'show' + (isError ? ' error' : '');
      setTimeout(() => popup.className = '', 2500);
    }

    fetch(`${WORKER}/count`)
      .then(r => r.json())
      .then(d => counter.textContent = `${d.count} people voted`);

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const res = await fetch(`${WORKER}/vote`, { method: 'POST' });
      const data = await res.json();
      counter.textContent = `${data.count} people voted`;
      showPopup(data.message, !data.success);
      if (data.success) btn.disabled = true;
      else btn.disabled = false;
    });

    document.getElementById('resetBtn').addEventListener('click', async () => {
      const secret = document.getElementById('secretInput').value;
      const res = await fetch(`${WORKER}/reset`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret })
      });
      const data = await res.json();
      if (data.success) {
        counter.textContent = '0 people voted';
        showPopup('Counter reset!');
      } else {
        showPopup('Wrong password', true);
      }
    });
  </script>
</body>
</html>
